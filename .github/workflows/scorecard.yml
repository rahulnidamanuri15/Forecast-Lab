name: Scorecard supply-chain security
on:
  push:
    branches: [ "main" ]
  # Re-runs the Branch-Protection check when a protection rule changes, so the
  # score reflects a settings edit and not only a code push.
  branch_protection_rule:
  schedule:
    - cron: '30 1 * * 6'
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    # A job-level permissions block REPLACES the top-level read-all - anything
    # omitted here is 'none', so checkout and Scorecard's own repo queries need
    # contents: read spelled out. Without it the run fails on clone.
    permissions:
      contents: read
      security-events: write  # upload SARIF to the code-scanning dashboard
      id-token: write         # OIDC token for publish_results / the badge

    steps:
      - name: "Checkout code"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Run analysis"
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: "Upload artifact"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: "Upload to code-scanning"
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: results.sarif
