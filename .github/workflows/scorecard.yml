name: Scorecard supply-chain security
on:
  push:
    branches: [ "main" ]
  # Re-runs the Branch-Protection check when a protection rule changes, so the
  # score reflects a settings edit and not only a code push.
  branch_protection_rule:
  schedule:
    - cron: '30 1 * * 6'
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    # A job-level permissions block REPLACES the top-level read-all - anything
    # omitted here is 'none', so checkout and Scorecard's own repo queries need
    # contents: read spelled out. Without it the run fails on clone.
    permissions:
      contents: read
      security-events: write  # upload SARIF to the code-scanning dashboard
      id-token: write         # OIDC token for publish_results / the badge

    steps:
      - name: "Checkout code"
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: "Run analysis"
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: "Upload artifact"
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: "Upload to code-scanning"
        uses: github/codeql-action/upload-sarif@e4d2851c4593439ac10bdcd57c5b06cac73b4775 # v3.37.8
        with:
          sarif_file: results.sarif
