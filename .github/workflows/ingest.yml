name: Daily Observation Ingestion

# This is the missing piece the pipeline needs: without it, observations
# never advances past its initial backfill, and make_prediction.py /
# score_predictions.py have nothing new to work with.
#
# Runs before the existing predict (6am UTC) and score (7am UTC) crons so
# fresh data is in the DB before either of those steps runs.
on:
  schedule:
    - cron: "0 5 * * *"  # 5:00 UTC daily, one hour before predictions
  workflow_dispatch: {}   # allow manual runs from the Actions tab

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Ingest latest observations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python ingest_observations.py

      - name: Engineer features for newly ingested data
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python engineer_features.py