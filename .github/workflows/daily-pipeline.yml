name: Daily Pipeline

# One job, one order. The steps are dependent - actuals must be ingested
# before yesterday's forecast can be scored - so they run sequentially in a
# single job instead of as three separate crons that only *hoped* the
# previous one had finished. Any step failing stops the job (Actions default),
# which is what we want: a bad forecast is worse than no forecast.
#
# Replaces the old ingest.yml / daily-prediction.yml / daily-scoring.yml.
#
# Two crons, not one, because GitHub's scheduler is best-effort on a free public
# repo: observed drift was 20-32 min through 08-26, then 11 hours on 08-27, then a
# dropped run on 08-28. Every write below is an `ON CONFLICT ... DO UPDATE` upsert
# and both score.py files score EVERY pending row, so the second cron is a free
# no-op when the first landed and a full catch-up when it didn't.
on:
  schedule:
    - cron: "17 5 * * *"  # 05:17 UTC = 10:47 IST; off the top-of-hour minute, which is the most contended slot
    - cron: "42 8 * * *"  # 08:42 UTC = 14:12 IST; retry net if the 05:17 run was dropped
  workflow_dispatch: {}

# The two crons above can overlap once the scheduler drifts by hours, which would
# run two full-recompute feature passes and two predict.py runs against the same
# forecast_date at once. Every write upserts so the data still converges, but the
# race is free to remove. cancel-in-progress: false deliberately - the second cron
# is a catch-up, not a replacement, and cancelling mid-run could stop a job between
# predict.py's commit and diagnose.py's gate. Same shape as static.yml.
concurrency:
  group: daily-pipeline
  cancel-in-progress: false

permissions:
  contents: read  # reads the checkout and the committed model; writes nothing back

jobs:
  pipeline:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      CITY: Nagpur
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: 1/6 Ingest observations
        run: python -m vericast.pm25.ingest

      - name: 2/6 Engineer features
        run: python -m vericast.pm25.features

      - name: 3/6 Leakage test
        run: python -m vericast.pm25.leakage_test

      - name: 4/6 Score pending predictions
        run: python -m vericast.pm25.score

      - name: 5/6 Make new forecast
        run: python -m vericast.pm25.predict

      - name: 6/6 Verify forecast is publishable
        run: python -m vericast.pm25.diagnose

  # Deliberately no `needs:` - the two targets share nothing but the database.
  # The electricity source is a community mirror that lags 2-4 days and can
  # stall; chaining these would let that stall block the live PM2.5 forecast,
  # which has its own working upstream. Independent jobs also run in parallel.
  electricity:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      STATE: Maharashtra
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: 1/6 Ingest demand and temperature
        run: python -m vericast.elec.ingest

      - name: 2/6 Engineer features
        run: python -m vericast.elec.features

      - name: 3/6 Leakage test
        run: python -m vericast.elec.leakage_test

      - name: 4/6 Score pending predictions
        run: python -m vericast.elec.score

      - name: 5/6 Make new forecast
        run: python -m vericast.elec.predict

      - name: 6/6 Verify forecast is publishable
        run: python -m vericast.elec.diagnose
