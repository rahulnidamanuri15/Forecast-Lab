# Publishes index.html to GitHub Pages on every push to main.
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# pages: write and id-token: write are what deploy-pages needs to claim the
# environment; contents: read is the checkout.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. cancel-in-progress: false - a half-applied Pages
# deploy is worse than a queued one.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0
      - name: Stage the dashboard only
        # upload-pages-artifact takes a directory, and `path: '.'` published the
        # whole repo to a public URL - models/, tests/, workflows, README. The
        # dashboard is one self-contained file, so stage just that.
        run: |
          mkdir -p _site
          cp index.html _site/
      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128  # v5
