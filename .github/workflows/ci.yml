name: CI

# Unit tests on every push and PR. No live database here, so
# tests/test_feature_alignment.py (which asserts against real pipeline rows) is
# ignored; the remaining 20 tests cover the API and pure logic. app.py raises at
# import without DATABASE_URL, hence the dummy DSN - nothing ever connects to it.
#
# ponytail: no matrix, no coverage gate, no lint job. Add a matrix when a second
# Python version is actually supported.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions: read-all

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest tests -q --ignore=tests/test_feature_alignment.py
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/unused
