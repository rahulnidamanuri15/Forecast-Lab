name: CI

# Unit tests on every push and PR. The whole suite runs - no file is excluded by
# name. tests/test_feature_alignment.py asserts against real pipeline rows and
# skips itself when no database is reachable, so it reports as skipped-with-a-
# reason here and starts running the day DATABASE_URL points at a real one.
# app.py raises at import without DATABASE_URL, hence the dummy DSN below.
#
# ponytail: no matrix, no coverage gate, no lint job. Add a matrix when a second
# Python version is actually supported.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions: read-all

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest tests -q -ra
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/unused
