name: Weekly Model Retrain

# Retrains the production LightGBM model on all data accumulated so far and
# commits the updated artifact back to the repo. daily-pipeline.yml checks out
# the repo fresh on every run, so it will automatically pick up whatever
# lightgbm_model.txt is committed here - no changes needed there.
on:
  schedule:
    - cron: '0 4 * * 0'  # 04:00 UTC every Sunday, an hour before the daily pipeline
  workflow_dispatch: {}   # allow manual runs from the Actions tab

permissions:
  contents: write  # required to commit the retrained model back to the repo

jobs:
  retrain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Retrain production model
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python train_production_model.py

      - name: Commit updated model artifact
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add lightgbm_model.txt
          if git diff --cached --quiet; then
            echo "No change in model artifact; nothing to commit."
          else
            git commit -m "Weekly retrain: update lightgbm_model.txt [skip ci]"
            git push
          fi