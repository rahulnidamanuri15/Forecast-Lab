name: Weekly Model Retrain

# Retrains the production LightGBM model on all data accumulated so far and
# commits the updated artifact back to the repo. daily-pipeline.yml checks out the
# repo fresh every run, so it picks up whatever is committed here.
#
# Neither retrain step overwrites its artifact unconditionally: vericast/gate.py
# scores a held-out challenger first and train.py returns without writing if it
# fails. A refused retrain exits 0 and leaves the file untouched, so the commit
# step takes its "nothing to commit" branch - a bad upstream week cannot replace a
# working model.
on:
  schedule:
    - cron: '0 4 * * 0'  # 04:00 UTC every Sunday, ahead of the daily pipeline's 05:17
    - cron: '0 4 * * 3'  # Wednesday catch-up: a dropped Sunday run no longer skips a week
  workflow_dispatch: {}   # allow manual runs from the Actions tab

permissions:
  contents: write  # required to commit the retrained model back to the repo
  pull-requests: write  # required to open a PR if direct push to main is blocked by branch rules

# This workflow pushes. Two overlapping runs - a drifted cron catching a manual
# dispatch, or a re-run - would both train and both `git push`, and the loser
# rejects on a non-fast-forward after spending the training. cancel-in-progress:
# false so a run is never killed between train.py writing the artifact and the
# commit step.
concurrency:
  group: weekly-retrain
  cancel-in-progress: false

jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # The commit step rebases onto origin/main before pushing, and a rebase
          # on the default depth-1 shallow clone fails.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version-file: .python-version
          cache: pip

      - name: Install dependencies
        timeout-minutes: 10
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Retrain production model
        timeout-minutes: 20
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CITY: Nagpur
        run: python -m vericast.pm25.train

      # always(): the two targets share nothing but the database. A raising PM2.5
      # train - dead DSN, upstream schema change - would otherwise abort this step
      # and the commit below, so one target's bad week skipped the other's
      # retrain. The job still reports failure.
      - name: Retrain electricity model
        if: always()
        timeout-minutes: 20
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          STATE: Maharashtra
        run: python -m vericast.elec.train

      # always() again: whichever artifact did get written must still be committed,
      # or a successful retrain is thrown away because its sibling failed. Both
      # failing leaves nothing staged and takes the "nothing to commit" branch.
      - name: Commit updated model artifact
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # The whole directory, not the four paths by name: a refused retrain
          # writes no .window.json sidecar, and `git add` on a pathspec that
          # matches nothing exits 128 under `bash -e` - aborting before the
          # "nothing to commit" branch below and throwing away the sibling
          # target's accepted artifact. models/ holds only these artifacts and
          # the sidecars that must travel with them.
          git add models/
          if git diff --cached --quiet; then
            echo "No change in model artifacts; nothing to commit."
            exit 0
          fi
          git commit -m "Weekly retrain: update model artifacts [skip ci]"

          # Attempt direct push (succeeds if branch protection allows bypass for actions)
          for attempt in 1 2 3; do
            if git push origin HEAD:${GITHUB_REF_NAME}; then
              echo "Pushed directly to ${GITHUB_REF_NAME} on attempt $attempt."
              exit 0
            fi
            echo "Push rejected (attempt $attempt); rebasing onto origin/${GITHUB_REF_NAME}."
            git pull --rebase origin "${GITHUB_REF_NAME}" || break
          done

          # Fallback: if direct push is blocked by branch rules, push to a branch and open a PR
          echo "Direct push blocked by branch protection. Pushing to branch and creating PR..."
          BRANCH="cron/weekly-retrain"
          git push -f origin HEAD:"${BRANCH}"
          gh pr create --base "${GITHUB_REF_NAME}" --head "${BRANCH}" \
            --title "Weekly retrain: update model artifacts [skip ci]" \
            --body "Automated retrain pipeline produced updated model artifacts in \`models/\`." || \
            echo "Pull request already exists or updated."
          exit 0