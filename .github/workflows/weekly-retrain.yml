name: Weekly Model Retrain

# Retrains the production LightGBM model on all data accumulated so far and
# commits the updated artifact back to the repo. daily-pipeline.yml checks out
# the repo fresh on every run, so it will automatically pick up whatever
# models/lightgbm_model.txt is committed here - no changes needed there.
#
# Neither retrain step overwrites its artifact unconditionally: vericast/gate.py
# scores a held-out challenger first and train.py returns without writing if it
# fails. A refused retrain exits 0 and leaves the file untouched, so the commit
# step below takes its existing "nothing to commit" branch - no special-casing
# here, and a bad upstream week cannot replace a working model.
on:
  schedule:
    - cron: '0 4 * * 0'  # 04:00 UTC every Sunday, an hour before the daily pipeline
  workflow_dispatch: {}   # allow manual runs from the Actions tab

permissions:
  contents: write  # required to commit the retrained model back to the repo

jobs:
  retrain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Retrain production model
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m vericast.pm25.train

      - name: Retrain electricity model
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          STATE: Maharashtra
        run: python -m vericast.elec.train

      - name: Commit updated model artifact
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add models/lightgbm_model.txt models/lightgbm_elec_model.txt
          if git diff --cached --quiet; then
            echo "No change in model artifacts; nothing to commit."
          else
            git commit -m "Weekly retrain: update model artifacts [skip ci]"
            git push
          fi