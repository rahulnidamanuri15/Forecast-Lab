version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "numpy"
        versions: [">= 2.5.0"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  # The Dockerfile pins its base image by digest, which never moves on its own.
  # This is what makes that pin get security updates instead of freezing.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"